# Perfil OCEANOS. No es un archivo de settings de ACOLITE.
# Configuración ensayada en cinco escenas; aceptación científica pendiente.
schema_version: 1
profile_version: 4
status: candidate

aoi:
  id: lapargera_v1
  geometry: W2C_South_AOI.kmz
  geometry_sha256: e7934bc269e0566f289cc8ab995a5fcb937065ec1b630789f84f226b50f981d5
  objective: calidad_del_agua
  extent_mode: bounding_box
  buffer_m: 0

search:
  sensor_family: sentinel2
  platforms: [S2A, S2B, S2C]
  level: L1C
  tile: 19QGV
  interval_start_utc: "2026-08-01T00:00:00Z"
  interval_end_exclusive_utc: "2026-08-21T00:00:00Z"
  cloud_cover:
    enabled: false
    maximum_percent: null
  selection: todas_las_adquisiciones_validas
  changed_content: reprocesar_con_historial

acolite:
  # Referencia auditada elegida para preparar el ensayo; instalación no actualizada.
  git_sha: 80da0c0c681d9597fd4b7737837d6a3e61907b33
  settings_file: acolite_s2.txt
  atmospheric_profile: defaults_del_sensor
  processing_concurrency: 1

products:
  # Esta lista expresa obligaciones científicas; acolite_s2.txt contiene la solicitud nativa.
  active: ["Rrs_*", tur_nechad2009, chl_oc3, ndci, fai, ndvi]
  # OC4 excluido por decisión del usuario el 29 de septiembre de 2026.
  required_quality_dataset: l2_flags
  preserve_l2r_for_derivation: true
  ocean_mask:
    water_products: mascara_L2W_nativa
    fai_ndvi: conservar_sin_mascara_acuatica_por_ahora
    final_ocean_only: pendiente_de_validar_mascara_nativa

grid:
  strategy: recorte_nativo_single_tile
  epsg: 32619
  resolution_m: [10, 10]
  final_reprojection: false
  # Convención ACOLITE: límite S,W,N,E; yrange N,S.
  limit_south_west_north_east:
    [17.83506768071816, -67.09176880642183, 18.047432637275, -66.40241185767644]
  candidate_native_grid:
    basis: projection_sub_con_extent_nominal_ESA
    xrange_m: [701980, 775330]
    yrange_m: [1997360, 1972960]
    shape_yx: [2440, 7335]
    pixel_size_xy_m: [10, -10]
    verified_with_scene: true
  mismatch_action: detener_publicacion_y_revisar

input:
  # Consulta de fase 5: Zarr sin resultados; cinco productos SAFE disponibles.
  strategy_status: definida_fase_5
  stac_base_url: https://stac.core.eopf.eodc.eu
  initial_expected_source: safe_temporal
  recheck_zarr_on_execution: true
  remove_zip: false
  remove_tar: false
  preferred: zarr_remoto_compatible
  fallback: safe_temporal
  notify_on_fallback: true
  automatic_fallback: true
  transient_attempts_total: 3
  retry_wait_seconds: [60, 300]

storage:
  # GB decimales: máximo conjunto de temporales, no por archivo.
  temporary_budget_bytes: 50000000000
  persistent_science: [L2R, L2W]
  keep_l1r_during_benchmark: true
  keep_catalog_logs_settings_validation_metrics: true
  raw_cleanup_on_success: despues_de_validar_y_registrar
  raw_cleanup_on_exhausted_failure: informar_y_eliminar_solo_fuentes_recuperables

validation:
  profile_state: multifecha_verificada_tecnicamente_pendiente_validacion_cientifica
  check_required_variables: true
  check_matching_grid: true
  report_valid_pixel_fraction: true
  scientific_validation: pendiente_datos_in_situ
