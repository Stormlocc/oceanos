[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanos"
version = "0.1.0"
description = "Wrapper local de ACOLITE para calidad del agua"
requires-python = ">=3.11"
dependencies = ["PyYAML", "numpy", "netCDF4", "pyproj"]

[project.scripts]
oceanos = "oceanos.cli:main"

[tool.setuptools.packages.find]
include = ["oceanos*"]
